<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SceneZOI</title>
<link rel="stylesheet" href="coui://inzoi/mod/inzoi-fonts.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
/* html/body MUST keep 'background: transparent' (game shows through; clicks outside the UI
   reach the game) and 'overflow: hidden'. NEVER set 'pointer-events: none' on html/body --
   it breaks inzoi.view.hover() / setHover() and leaks wheel/click input to the game camera. */
html, body { width: 100%; height: 100%; background: transparent; overflow: hidden;
             font-family: var(--inzoi-font-ui); font-size: 22px; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
/* The generated resizable scaffold sets inline overflow:hidden. Attached tools
   and the outfit panel intentionally extend beyond this root; content areas
   retain their own clipping/scrolling. Keep window.js unchanged. */
#app-root { position: relative; display: flex; flex-direction: column; overflow: visible !important; }
#title-bar { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
             padding: 4px 8px; background: #d9d9d9; color: #474747;
             user-select: none; -webkit-user-select: none; }
#title-text { font-size: 16px; font-weight: bold; }
#title-buttons { display: flex; align-items: center; gap: 6px; }
/* ASCII-only icons: _ for minimize, X for close.
   Minimize is disabled by default in this scaffold (display:none). */
#minimize-btn, #close-btn {
    cursor: pointer; font-size: 14px; font-weight: bold; line-height: 1.4;
    font-family: var(--inzoi-font-mono, Consolas, monospace);
    background: #f5f5f5; border: 1px solid #bfbfbf;
    color: #474747; border-radius: 3px; padding: 1px 7px;
    user-select: none; -webkit-user-select: none; }
#minimize-btn:hover { background: #a1d4fd; }
#close-btn:hover    { background: #a1d4fd; }
#minimize-btn { display:none; }
#content { flex: 1; min-height: 0; padding: 8px; overflow: auto; overscroll-behavior: contain; }
/* floating: drag via title-bar */
#app-root { position: absolute; top: 605px; left: 100px; }
#title-bar { cursor: move; }
/* resizable: bottom-right handle */
#resize-handle { position: absolute; bottom: 0; right: 0; width: 18px; height: 18px; cursor: nwse-resize; opacity: 0.7;
 background: linear-gradient(135deg, transparent 40%, rgba(71,71,71,0.5) 41%, rgba(71,71,71,0.5) 55%, transparent 56%, transparent 68%, rgba(71,71,71,0.4) 69%, rgba(71,71,71,0.4) 80%, transparent 81%); }
#resize-handle:hover { opacity: 1; }
#app-root { width: 320px; height: 410px; left: 100px; top: 605px; color: #222222;
    background: #d9d9d9; border: 1px solid #bfbfbf; border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.25); }
#title-bar { min-height: 42px; padding: 10px 14px; background: #d9d9d9; }
#title-text { flex: 1; min-width: 0; font-size: 17px; line-height: 1.25; text-align: center; text-transform: uppercase;
    letter-spacing: .65px; word-break: normal; word-wrap: break-word; overflow-wrap: break-word; white-space: normal; }
#content { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
#scene-status { flex: 0 0 auto; min-height: 22px; padding: 4px 12px; font-size: 12px;
    line-height: 1.35; color: #6f6f6f; word-break: normal; word-wrap: break-word; overflow-wrap: break-word; white-space: normal; }
#scene-auto-mode { display: none; width: calc(100% - 28px); cursor: pointer; margin: 0 12px 7px; padding: 8px; font-family: var(--inzoi-font-ui);
    border: 1px solid #bfbfbf; border-radius: 4px; background: #eeeeee; color: #333333; }
#scene-auto-mode.selected { background: #3185c3; color: #ffffff; }
#scene-navigation { flex: 1 1 auto; min-height: 0; overflow-y: scroll; overflow-x: hidden;
    margin: 0 8px 10px 12px; padding-right: 8px; overscroll-behavior: contain; }
#scene-navigation::-webkit-scrollbar { width: 5px; }
#scene-navigation::-webkit-scrollbar-track { background: #eeeeee; border-radius: 3px; }
#scene-navigation::-webkit-scrollbar-thumb { background: #b5b5b5; border-radius: 3px; }
#scene-navigation button { display: block; width: 100%; cursor: pointer; margin-bottom: 7px;
    padding: 8px 10px; text-align: center; font-size: 16px; line-height: 1.25;
    border: 0; border-radius: 3px; color: #222222; background: #f5f5f5; word-break: normal; word-wrap: break-word; overflow-wrap: break-word; white-space: normal; }
/* Keep ordinary words intact; break-word is only a fallback for oversized tokens.
   Avoid anywhere: the embedded renderer splits names even at available spaces. */
#outfit-selector, #outfit-participants button, #expression-set, #expression-choices button,
.voice-select, .voice-choices button, #outfit-title, #personality-status, .voice-status {
    min-width: 0; white-space: normal; word-break: normal; word-wrap: break-word; overflow-wrap: break-word;
}
/* Set the full native font stack directly on controls: inherited control fonts
   and a narrowed Pretendard/NotoSans list can omit Japanese/Chinese glyphs.
   The shared inzoi-fonts.css includes the game's CJK faces; bundle no fonts. */
#scene-navigation button, #scene-exit, #scene-restore { font-family: var(--inzoi-font-ui); }
#scene-navigation button:hover { background: #a1d4fd; }
#scene-footer { display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto;
    gap: 12px; min-height: 62px; padding: 10px 12px; background: #d0d0d0; }
#scene-exit { cursor: pointer; flex: 0 0 auto; min-width: 78px; padding: 8px 14px;
    border: 0; border-radius: 4px; background: #a1d4fd; color: #474747; font-size: 17px; font-weight: 600; }
#scene-speed { display: flex; align-items: center; gap: 10px; }
#speed-down, #speed-up { width: 27px; height: 27px; padding: 0; cursor: pointer;
    border: 0; border-radius: 50%; background: #a1d4fd; color: #474747; line-height: 24px; font-size: 26px; }
#speed-display { min-width: 52px; text-align: center; }
#speed-label { display: block; font-size: 16px; font-weight: 600; }
#speed-dots { display: flex; gap: 4px; align-items: center; justify-content: center; margin-top: 3px; }
.speed-dot { width: 4px; height: 4px; border-radius: 50%; background: #a0a0a0; }
.speed-dot.selected { background: #3185c3; }
/* The game's launcher button injects its own colors after page load. */
#hide-btn { background: #f5f5f5 !important; border-color: #bfbfbf !important; color: #474747 !important; }
#hide-btn:hover { background: #a1d4fd !important; }
#hide-btn .hide-tip { background: #f5f5f5 !important; color: #222222 !important; }
/* DOM-only hiding leaves the native receiver and its session heartbeat alive. */
#scene-restore { display: none; width: 100%; height: 100%; border: 0; border-radius: 7px;
    background: #d9d9d9; color: #474747; font-size: 14px; font-weight: 600; cursor: grab;
    user-select: none; -webkit-user-select: none; }
#scene-restore.scene-dragging { cursor: grabbing; }
#scene-restore:hover { background: #a1d4fd; }
#app-root.scene-compact { width: 134px !important; height: 36px !important; }
#app-root.scene-compact > #scene-restore { display: block; }
#app-root.scene-compact > #title-bar, #app-root.scene-compact > #content,
#app-root.scene-compact > #resize-handle, #app-root.scene-compact > #scene-tools,
#app-root.scene-compact > #outfit-panel, #app-root.scene-compact > #scene-tasks { display: none !important; }
/* Cohtml views sit above native UMG. Match its dark modal scrim locally and
   release native hit bounds; do not hide/suspend the receiver or pause the scene. */
#app-root.scene-menu-blocked { pointer-events: none; }
#app-root.scene-menu-blocked::after, #app-root.scene-menu-blocked #scene-tools::after,
#app-root.scene-menu-blocked #outfit-panel::after, #app-root.scene-menu-blocked #scene-tasks::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.65); border-radius: 7px; z-index: 100; pointer-events: none;
}
button:disabled { cursor: default; opacity: .45; }
button:focus-visible { outline: 2px solid #3185c3; outline-offset: 2px; }
/* Attached scene tools and outfit window share the native inZOI palette. */
#title-bar { border-radius: 7px 7px 0 0; }
#scene-footer { border-radius: 0 0 7px 7px; }
#scene-tools { position: absolute; left: 0; top: -40px; display: none; gap: 5px; height: 35px; }
#scene-tools button { width: 40px; height: 35px; border: 1px solid #bfbfbf; border-radius: 4px;
    background: #6f6f6f; cursor: pointer; padding: 0; }
#scene-tools img { width: 30px; height: 30px; vertical-align: middle; pointer-events: none; }
#scene-tools button:hover, #scene-tools button.selected { background: #3185c3; }
#scene-tools button:disabled { opacity: .65; cursor: default; }
#outfit-panel { position: absolute; top: 0; left: 330px; width: 320px; height: 410px; display: none;
    flex-direction: column; overflow: hidden; border: 1px solid #bfbfbf; border-radius: 8px;
    background: #d9d9d9; color: #222222; box-shadow: 0 8px 28px rgba(0,0,0,.25); }
#outfit-panel button { font-family: var(--inzoi-font-ui); }
#outfit-heading { display: flex; justify-content: space-between; align-items: center; min-height: 42px;
    flex: 0 0 auto; padding: 5px 10px 5px 15px; font-size: 17px; font-weight: 700; color: #474747; }
#outfit-close { width: 30px; height: 30px; border: 0; border-radius: 4px; background: transparent;
    color: #6f6f6f; font-size: 17px; cursor: pointer; }
#outfit-close:hover { background: #a1d4fd; }
#outfit-selector-wrap { position: relative; margin: 0 12px; flex: 0 0 auto; }
#outfit-selector, #outfit-participants button { width: 100%; padding: 8px 10px; border: 0; border-radius: 3px;
    text-align: left; font-size: 15px; color: #222222; background: #f5f5f5; cursor: pointer; }
#outfit-participants { position: absolute; top: 100%; left: 0; right: 0; z-index: 5;
    background: #f5f5f5; border: 1px solid #bfbfbf; border-radius: 3px; }
#outfit-participants button:hover { background: #a1d4fd; }
#outfit-status { min-height: 20px; flex: 0 0 auto; padding: 3px 12px; font-size: 12px; color: #6f6f6f; }
#outfit-pieces { flex: 1 1 auto; min-height: 0; overflow-y: scroll; overflow-x: hidden;
    margin: 0 8px 10px 12px; padding-right: 8px; overscroll-behavior: contain; }
#outfit-pieces::-webkit-scrollbar { width: 5px; }
#outfit-pieces::-webkit-scrollbar-track { background: #eeeeee; border-radius: 3px; }
#outfit-pieces::-webkit-scrollbar-thumb { background: #b5b5b5; border-radius: 3px; }
.outfit-piece { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 5px; padding: 8px 10px; background: #f5f5f5; border-radius: 3px; }
.outfit-piece-name { flex: 1; min-width: 0; font-size: 14px; line-height: 1.25; word-break: normal; word-wrap: break-word; overflow-wrap: break-word; white-space: normal; }
.outfit-switch { position: relative; flex: 0 0 auto; width: 40px; height: 20px; border: 0; border-radius: 10px;
    background: #b5b5b5; cursor: pointer; }
.outfit-switch.on { background: #a1d4fd; }
.outfit-switch-knob { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; pointer-events: none; }
.outfit-switch.on .outfit-switch-knob { left: 22px; }
#personality-fields { flex: 1; min-height: 0; display: none; padding: 10px 12px; overflow-y: auto; }
#personality-fields label { display: block; font-size: 15px; margin-bottom: 8px; }
#expression-set, #expression-choices button { width: 100%; padding: 8px; border: 1px solid #bfbfbf; border-radius: 3px;
    background: #f5f5f5; color: #222; font-size: 15px; }
#expression-set { text-align: left; cursor: pointer; }
#expression-choices { display: none; max-height: 210px; overflow-y: auto; }
#expression-choices button { display: block; text-align: left; cursor: pointer; font-family: var(--inzoi-font-ui); }
#expression-choices button:hover { background: #a1d4fd; }
#voice-fields { margin-top: 12px; }
#voice-fields label { margin-top: 12px; }
#voice-fields > label:first-child { margin-top: 0; }
.voice-select, .voice-choices button { font-size: 15px; width: 100%; padding: 8px; border: 1px solid #bfbfbf; border-radius: 3px; background: #f5f5f5; color: #222; text-align: left; cursor: pointer; font-family: var(--inzoi-font-ui); }
.voice-choices { max-height: 180px; overflow-y: auto; }
.voice-choices button { display: block; }
.voice-choices button:hover { background: #a1d4fd; }
.voice-status { margin-top: 12px; font-size: 12px; color: #6f6f6f; }
#personality-status { font-size: 12px; line-height: 1.4; margin-top: 6px; color: #6f6f6f; }
/* Fixed-width attached task tray; its list scrolls independently of navigation. */
#scene-tasks { position: absolute; width: 132px; display: none; flex-direction: column;
    overflow: hidden; background: #d9d9d9; color: #222222; border: 1px solid #bfbfbf;
    border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.25); }
#scene-tasks-heading { flex: 0 0 auto; font-size: 14px; font-weight: 700; color: #474747;
    text-align: center; padding: 12px 4px 8px; }
#scene-task-list { flex: 1 1 auto; min-height: 0; overflow-y: scroll; overflow-x: hidden;
    overscroll-behavior: contain; padding: 0 5px 6px; }
#scene-task-list::-webkit-scrollbar { width: 5px; }
#scene-task-list::-webkit-scrollbar-track { background: #eeeeee; border-radius: 3px; }
#scene-task-list::-webkit-scrollbar-thumb { background: #b5b5b5; border-radius: 3px; }
.scene-task { margin: 6px 0 15px; text-align: center; }
.task-participant, .task-label { font-size: 12px; line-height: 1.3; white-space: normal;
    word-break: normal; overflow-wrap: break-word; }
.task-participant { font-weight: 600; margin-bottom: 3px; }
.task-ring { position: relative; width: 86px; height: 86px; margin: 0 auto 3px; }
.task-percent { position: absolute; top: 0; left: 0; width: 86px; height: 86px;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
    font-weight: 600; }
.task-ring svg { display: block; }

.settings-section-title { margin: 10px 0 6px; font-size: 15px; color: #474747; }
#settings-fields { flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 12px; }
.audio-settings-note, #settings-status-task_rates, #settings-status-audio { font-size: 12px; line-height: 1.35; color: #6f6f6f; }
.audio-settings-note { margin: 4px 0 16px; }
.audio-setting { margin-bottom: 18px; }
.audio-setting label { display: block; font-size: 15px; margin-bottom: 5px; }
.audio-setting-row { display: flex; align-items: center; gap: 5px; }
.audio-setting-row input { width: 44px; padding: 4px; border: 1px solid #bfbfbf; border-radius: 3px;
    font-family: var(--inzoi-font-ui); font-size: 14px; text-align: right; color: #222; background: #f5f5f5; }
.audio-setting-row > span { font-size: 13px; }
.volume-slider { flex: 1; position: relative; height: 26px; margin: 0 8px; cursor: pointer; }
.volume-track, .volume-fill { position: absolute; top: 10px; left: 0; right: 0; height: 6px; border-radius: 3px; background: #b5b5b5; pointer-events: none; }
.volume-fill { right: auto; background: #3185c3; }
.volume-thumb { position: absolute; top: 4px; width: 18px; height: 18px; margin-left: -9px;
    border: 1px solid #6f6f6f; border-radius: 50%; background: #a1d4fd; pointer-events: none; }
.volume-slider[aria-disabled="true"] { opacity: .45; cursor: default; }
.volume-slider:focus { outline: 2px solid #3185c3; outline-offset: 1px; }
</style>
</head>
<body>
<div id="app-root">
  <div id="title-bar">
    <span id="title-text">scenezoi</span>
    <div id="title-buttons">
      <span id="minimize-btn">_</span>
      <span id="close-btn">X</span>
    </div>
  </div>
  <div id="content">
  </div>
</div>
<!-- ===================================================================
     REQUIRED SCRIPTS -- DO NOT REMOVE OR REORDER.
     If you rewrite this file, these four <script> tags MUST stay, in order:
       1. coui://inzoi/cohtml.js        -> engine (game bridge; input forwarding)
       2. coui://inzoi/mod/inzoi-sdk.js -> inzoi.* (view.hover, cli, saveState...)
       3. window.js                     -> scaffold window mgr; defines the wf global
       4. app.js                        -> your mod logic (uses wf)
     Dropping #1 or #2 silently breaks input/hover: the game stops receiving
     clicks outside the UI and inzoi.* APIs throw. window.js logs a loud error
     if either is missing (see its dependency guard).
     ==================================================================== -->
<script src="coui://inzoi/cohtml.js"></script>
<script src="coui://inzoi/mod/inzoi-sdk.js"></script>
<script src="window.js"></script>
<script src="localization.js"></script>
<script src="panel-state.js"></script>
<script src="voice-ui.js"></script>
<script src="settings-ui.js"></script>
<script src="task-ui.js"></script>
<script src="outfit-ui.js"></script>
<script src="save-guard.js"></script>
<script src="addon-bridge.js"></script>
<script src="app.js"></script>
<script src="demo-entry.js"></script>
</body>
</html>
